name: CI Pipeline - Smart Restaurant

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  # =============================================
  # JOB 1 : Tests (Matrice Java 17 et 21 — Bonus B3 +1 pt)
  # =============================================
  test:
    name: Tests Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['17', '21']
      fail-fast: false

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Exécuter les tests unitaires
        run: mvn clean test

      - name: Archiver le rapport de tests (Artefact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-tests-java-${{ matrix.java-version }}
          path: target/surefire-reports/*.xml

  # =============================================
  # JOB 2 : Build Docker (seulement si les tests passent)
  # =============================================
  docker-build:
    name: Build image Docker
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construction de l'image (validation du Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: smart-restaurant:ci

  # =============================================
  # JOB 3 : Publication image sur ghcr.io (sur tag v*)
  # =============================================
  release:
    name: Publication image ghcr.io
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image immuable sur ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/smart-restaurant:${{ github.ref_name }}

  # =============================================
  # JOB 4 : Déploiement automatique sur tag & Contrôle de santé (Bonus B2 +2 pts)
  # =============================================
  deploy-staging:
    name: Déploiement Staging automatique & Contrôle de santé
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer le fichier d'environnement de déploiement
        run: |
          echo "IMAGE_TAG=${{ github.ref_name }}" > .env.deploy
          cat .env.deploy

      - name: Déployer l'environnement Staging avec Docker Compose
        run: |
          docker compose --env-file .env.deploy -f compose.staging.yaml pull
          docker compose --env-file .env.deploy -f compose.staging.yaml up -d

      - name: Contrôle de santé automatisé (wait-healthy.sh)
        run: |
          chmod +x scripts/wait-healthy.sh
          ./scripts/wait-healthy.sh

      - name: Arrêter et nettoyer le Staging
        if: always()
        run: |
          docker compose -f compose.staging.yaml down -v
