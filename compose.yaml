services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smart_restaurant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_restaurant"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Aucun port publié vers l'hôte (sécurité : la BD n'est pas accessible de l'extérieur)

  api:
    build: .
    ports:
      - "2626:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/smart_restaurant
      DB_USER: postgres
      DB_PASSWORD: dev-password
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
