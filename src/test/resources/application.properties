# ============================================================
# Configuration de test — remplace PostgreSQL par H2 en mémoire
# Ce fichier est utilisé UNIQUEMENT pendant mvn test (CI/CD)
# ============================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Désactiver Flyway en test (H2 crée le schéma via Hibernate)
spring.flyway.enabled=false

# JWT
jwt.secret=9a76a982ba3643be8e4544d6738c82138b398d5c412e4f55a10f88237d04cf8a
jwt.expiration=86400000

# Désactiver les appels IA en test
ollama.api.url=http://localhost:11434
ollama.model=test
claude.api.key=test-key
